<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hana & One 座位表收藏館，收藏與整理歷年演唱會座位資訊。">
<title>Hana & One｜Seat Plan Archive</title>
<style>
:root{
  --ink:#171717; --yellow:#ffc64a; --orange:#f5a52f;
  --paper:#fffdf9; --white:#fff; --muted:#8b877f;
  --line:#eee8dc; --cream:#fff8e9;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
a{color:inherit;text-decoration:none}
.site-header{max-width:1160px;margin:auto;padding:24px 30px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:13px}
.brand-mark{width:82px;height:82px;object-fit:contain;display:block;filter:drop-shadow(0 2px 1px rgba(255,191,63,.08))}
.brand-name{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;font-weight:900;letter-spacing:.09em}
.brand-sub{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;color:var(--muted);letter-spacing:.16em;margin-top:4px}
.header-note{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;color:var(--muted);letter-spacing:.16em}
.hero{max-width:1160px;margin:8px auto 0;padding:0 30px}
.hero-panel{min-height:270px;background:var(--white);border:1px solid var(--line);border-radius:22px;padding:47px 58px 42px;position:relative;overflow:hidden;display:flex;align-items:center}
.hero-copy{position:relative;z-index:2;max-width:620px}
.eyebrow{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;letter-spacing:.2em;color:#b47b19;text-transform:uppercase}
h1{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:900;font-size:clamp(34px,5vw,53px);letter-spacing:.015em;margin:13px 0 12px;line-height:1.12}
.hero p{max-width:560px;color:#68645d;font-size:14px;line-height:1.9;margin:0}
.hero-rule{width:62px;height:5px;background:var(--yellow);border-radius:99px;margin-top:23px;transform:rotate(-2deg)}
.hero-doodle{position:absolute;width:300px;height:250px;right:6%;top:50%;transform:translateY(-50%);opacity:1}
.content{max-width:1160px;margin:0 auto;padding:45px 30px 76px}
.toolbar{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.section-kicker{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;letter-spacing:.2em;color:#bd851d;font-weight:800}
.section-title{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);font-size:24px;margin:6px 0 0;font-weight:800}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.search-wrap{position:relative}
.search-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#aaa08f;font-size:18px}
input,select{height:43px;border:1px solid #e9e2d5;border-radius:999px;background:white;color:#39352f;padding:0 16px;font:inherit;font-size:13px;outline:none}
input{width:240px;padding-left:40px}
select{min-width:120px}
input:focus,select:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,198,74,.18)}
.year-heading{display:flex;align-items:center;gap:14px;margin:36px 0 17px}
.year-heading h3{margin:0;color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;font-size:25px;font-weight:800;letter-spacing:.02em}
.year-heading .line{height:1px;background:#e9e2d5;flex:1}
.year-heading small{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;color:var(--muted);letter-spacing:.12em}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{background:white;border:1px solid #eee8dc;border-radius:18px;overflow:hidden;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-4px) rotate(-.25deg);border-color:#f0c96f;box-shadow:0 12px 28px rgba(91,69,25,.09)}
.cover{aspect-ratio:16/9;background:var(--cream);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.card:hover .cover img{transform:scale(1.035)}
.cover:before,.cover:after{content:"";position:absolute;border:1.5px solid rgba(245,165,47,.35);border-radius:50%;width:150px;height:150px;pointer-events:none}
.cover:after{width:112px;height:112px}
.cover-label{z-index:1;color:#27231c;font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;font-weight:700;letter-spacing:.16em;text-align:center}
.cover-label small{display:block;font-family:"Helvetica Neue",Arial,sans-serif;font-size:9px;letter-spacing:.16em;color:#a18d65;margin-top:8px}
.card-body{padding:16px 18px 17px}
.card-meta{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.06em;color:var(--muted)}
.tag{color:#72500e;background:#fff4d8;padding:5px 9px;border-radius:999px}
.card h4{font-size:16px;font-weight:700;color:#25221d;margin:12px 0 8px;line-height:1.55}
.card-foot{border-top:1px solid #f2eee6;padding-top:12px;margin-top:13px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}
.open-link{color:#27231c;font-weight:800;font-family:"Helvetica Neue",Arial,sans-serif;letter-spacing:.04em}
.open-link b{color:#e8a322;font-size:18px;margin-left:5px}
.empty{display:none;padding:42px 10px;text-align:center;color:var(--muted);font-size:13px}
.footer{border-top:1px solid #eee8dc;text-align:center;padding:25px 20px 32px;color:#969087;font-size:11px;letter-spacing:.06em;line-height:1.9}
.footer strong{color:#373128;font-weight:800}
.footer-flower{color:#e9ad32;font-size:15px;margin:0 5px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-panel{padding:42px 38px}.hero-doodle{right:1%;opacity:.32;width:230px}}
@media(max-width:560px){.site-header{padding:17px 18px}.brand-mark{width:64px;height:64px}.header-note{display:none}.hero,.content{padding-left:18px;padding-right:18px}.hero-panel{padding:35px 24px;min-height:245px}.hero-doodle{width:170px;right:-24px;opacity:.2}.grid{grid-template-columns:1fr}.toolbar{align-items:flex-start}.controls{width:100%}.search-wrap{flex:1}input{width:100%}.cover{aspect-ratio:16/9}}

      const title=document.createElement("h4");title.textContent=p.title;
      const foot=document.createElement("div");foot.className="card-foot";
      const desc=document.createElement("span");desc.textContent="查看座位表";
      const open=document.createElement("span");open.className="open-link";open.innerHTML='OPEN <b>↗</b>';
      foot.append(desc,open);body.append(meta,title,foot);card.append(cover,body);grid.append(card);
    });
    section.append(heading,grid);archive.append(section);
  });
  empty.style.display=filtered.length?"none":"block";
}
search.addEventListener("input",render);
yearFilter.addEventListener("change",render);
render();
</script>
